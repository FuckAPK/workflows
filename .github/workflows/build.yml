name: Build and Release

# Reusable workflow. Call it from a project repository:
#
#   jobs:
#     build:
#       uses: FuckAPK/workflows/.github/workflows/build.yml@v1
#       permissions:
#         contents: write
#       secrets: inherit
#
# Two mutually exclusive jobs:
#
#   pull request / branch push -> `verify`  : assembleDebug, no secrets at all
#   tag push                   -> `package` : signed release APK + GitHub release
#
# Reference this repository as `@v1`. The tag is the floating major version: move it when a
# change here should reach the projects, so that none of them has to be edited.

on:
  workflow_call:
    secrets:
      # Only the `package` job uses them, and that job only runs for tags. They are declared
      # `required: false` so the secret-free `verify` job can run for pull requests -
      # Dependabot pull requests never receive repository secrets.
      KEYSTORE_FILE:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    # Everything except tags. This is the job that gates pull requests.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # `versionCode` is derived from the git history.
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Deliberately unsigned and secret-free.
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

  package:
    name: Release APK
    # Tags only. No `needs: verify` on purpose: the debug build is redundant here, and a
    # skipped dependency would skip this job as well.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "::error::KEYSTORE_FILE is empty - configure the release secrets for this repository"
            exit 1
          fi
          printf '%s' "$KEYSTORE_FILE" | base64 --decode --ignore-garbage > keystore.jks
          {
            echo "storeFilePath=$PWD/keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > signing.properties

      - name: Assemble release
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_id }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 15

      - name: Attach APK to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
